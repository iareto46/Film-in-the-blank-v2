      try{
        var savedPin=localStorage.getItem('fitb_choice_host_pin');
        if(savedPin){var g=await dbGet('games_choice/'+savedPin);if(g){pinRef.current=savedPin;setPin(savedPin);setLoading(false);subscribeGame(savedPin);return;}}
        var newPin=genPin();
        await dbSet('games_choice/'+newPin,{pin:newPin,status:'lobby',totalScores:{},teams:{},round:freshRound()});
        localStorage.setItem('fitb_choice_host_pin',newPin);
        pinRef.current=newPin;setPin(newPin);setLoading(false);subscribeGame(newPin);
      }catch(e){console.warn(e);setLoading(false);}
    })();
  },[]);

  async function newGame(){
    var newPin=genPin();
    await dbSet('games_choice/'+newPin,{pin:newPin,status:'lobby',totalScores:{},teams:{},round:freshRound()});
    localStorage.setItem('fitb_choice_host_pin',newPin);
    pinRef.current=newPin;setPin(newPin);setAnnouncing(false);setWatchingId(null);setPendingCards([]);
    subscribeGame(newPin);
  }

  async function newRound(){
    await dbUpdate('games_choice/'+pinRef.current,{status:'started',totalScores:{},round:freshRound()});
    setAnnouncing(false);setWatchingId(null);setPendingCards([]);
  }

  async function startGame(){
    await dbUpdate('games_choice/'+pinRef.current,{status:'started'});
    setPendingCards([]);
  }

  function addSceneType(type){setPendingCards([type]);}
  function randomSceneType(){addSceneType(shuffle(SCENE_TYPES)[0]);}
  function addDescriptor(desc){setPendingCards(function(pc){if(pc.length>=3||pc.includes(desc))return pc;return pc.concat([desc]);});}
  function randomDescriptor(){if(pendingCards.length>=3)return;var avail=DESCRIPTORS.filter(function(d){return !pendingCards.includes(d);});addDescriptor(shuffle(avail)[0]);}
  function removeCard(idx){setPendingCards(function(pc){if(idx===0)return[];return pc.filter(function(_,i){return i!==idx;});});}

  async function lockInAndAnnounce(){
    if(pendingCards.length===0)return;
    await dbUpdate('games_choice/'+pinRef.current+'/round',{cards:pendingCards});
    setAnnouncing(true);
  }

  async function openVoting(){
    await dbUpdate('games_choice/'+pinRef.current+'/round',{votingOpen:true});
    setWatchingId(null);
  }

  async function closeVotingAndScore(){
    var round=game.round||freshRound();
    var directors=game.teams?Object.entries(game.teams).map(function(e){return Object.assign({id:e[0]},e[1]);}):[];
    var votes=round.votes||{};
    var voteCounts={};
    directors.forEach(function(d){voteCounts[d.id]=0;});
    Object.values(votes).forEach(function(vid){if(voteCounts[vid]!==undefined)voteCounts[vid]++;});
    var maxVotes=Math.max.apply(null,Object.values(voteCounts).length?Object.values(voteCounts):[0]);
    var newScores={};
    directors.forEach(function(d){var vpts=voteCounts[d.id]||0;var bonus=maxVotes>0&&voteCounts[d.id]===maxVotes?1:0;newScores[d.id]=vpts+bonus;});
    await dbUpdate('games_choice/'+pinRef.current+'/round',{votingOpen:false,voteCounts:voteCounts,roundScores:newScores,scored:true});
    await dbUpdate('games_choice/'+pinRef.current+'/totalScores',newScores);
  }

  function getYTEmbed(url){var id=extractYouTubeId(url);return id?'https://www.youtube.com/embed/'+id+'?autoplay=1':null;}

  var logoEl=h('a',{href:'index.html',className:'logo',style:{textDecoration:'none'}},'Film ',h('span',null,'In'),' The Blank',h('small',{className:'logo-sub'},"Director's Choice"));

  if(loading)return h('div',{className:'page'},h('div',{className:'header'},logoEl),h('div',{className:'main'},h('span',{className:'spinner'}),' Setting up…'));
  if(!game)return h('div',{className:'page'},h('div',{className:'header'},logoEl),h('div',{className:'main'},h('span',{className:'spinner'}),' Connecting…'));

  var directors=game.teams?Object.entries(game.teams).map(function(e){return Object.assign({id:e[0]},e[1]);}):[];
  var baseUrl=window.location.href.split('?')[0].replace(/#.*/,'');
  var round=game.round||freshRound();
  var totalScores=game.totalScores||{};

  if(game.status==='lobby')return h('div',{className:'page'},
    h('div',{className:'header'},logoEl,h('button',{className:'btn btn-outline',onClick:newGame,style:{fontSize:'.75rem'}},'New PIN')),
    h('div',{className:'main'},
      h('div',{style:{textAlign:'center'}},
        h('div',{style:{fontFamily:"'Playfair Display',serif",fontStyle:'italic',color:'#777',fontSize:'1rem',marginBottom:'.8rem'}},'Welcome to the screening room'),
        h('p',{style:{color:'#555',fontSize:'.85rem',textTransform:'uppercase',letterSpacing:2,marginBottom:'.3rem'}},'Game PIN'),
        h('div',{className:'pin-display'},pin),
        h('p',{className:'pin-sub',style:{marginTop:'.6rem'}},'Scan to join'),
        h(QRBlock,{url:baseUrl+'#player?pin='+pin,size:160}),
        h('p',{style:{color:'#444',fontSize:'.72rem',marginTop:'.5rem'}},'or visit ',h('span',{style:{color:'#f59e0b'}},baseUrl+'#player'),' and enter PIN ',h('span',{style:{color:'#f59e0b'}},pin))
      ),
      h('div',{style:{width:'100%',maxWidth:480}},
        h('p',{style:{color:'#555',fontSize:'.78rem',textTransform:'uppercase',letterSpacing:1,marginBottom:'.8rem',textAlign:'center'}},'Directors in the room ('+directors.length+'/8)'),
        directors.length===0?h('p',{className:'waiting-directors'},'Waiting for directors to arrive…')
        :h('div',{className:'directors-grid'},directors.map(function(d){return h('div',{key:d.id,className:'director-row',style:{borderColor:hex2rgba(d.color,.4)}},h('div',{className:'director-swatch',style:{background:d.color}}),h('span',{className:'director-name',style:{color:d.color}},d.name));}))
      ),
      h('button',{className:'btn btn-gold btn-lg',onClick:startGame,disabled:directors.length<1,style:{minWidth:220}},directors.length<1?'Waiting for directors…':'🎬 Call Action →')
    )
  );

  if(!round.cards||round.cards.length===0)return h('div',{className:'page'},
    h('div',{className:'header'},logoEl,h('button',{className:'btn btn-outline',onClick:newGame,style:{fontSize:'.75rem'}},'New PIN')),
    h('div',{className:'main'},
      h('div',{style:{textAlign:'center'}},h('div',{style:{fontFamily:"'Playfair Display',serif",fontStyle:'italic',color:'#aaa',fontSize:'1rem',marginBottom:'.3rem'}},'Build this round\'s category'),h('div',{className:'divider'})),
      h('div',{className:'chosen-cards-row'},
        pendingCards.length===0?h('p',{style:{color:'#444',fontSize:'.85rem',fontFamily:"'Playfair Display',serif",fontStyle:'italic'}},'Pick a scene type to begin…')
        :pendingCards.map(function(c,i){return h('div',{key:i,className:'chosen-card-chip '+(i===0?'scene-type':'descriptor')},c,h('button',{onClick:function(){removeCard(i);}},'✕'));})
      ),
      pendingCards.length>0&&h('p',{style:{color:'#666',fontFamily:"'Playfair Display',serif",fontStyle:'italic',fontSize:'.95rem',marginTop:'-.8rem'}},'Reads as: ',h('strong',{style:{color:'#f59e0b',fontStyle:'normal'}},categoryPhrase(pendingCards))),
      pendingCards.length===0&&h('div',{className:'picker-section'},
        h('div',{className:'picker-heading'},'Step 1 — Pick a Scene Type'),
        h('div',{className:'row',style:{marginBottom:'.8rem'}},h('button',{className:'btn btn-gold',onClick:randomSceneType},'🎲 Random Scene Type')),
        h('input',{className:'input-field',placeholder:'Search scene types…',value:categoryFilter,onChange:function(e){setCategoryFilter(e.target.value);}}),
        h('div',{className:'category-grid',style:{marginTop:'.6rem'}},
          SCENE_TYPES.filter(function(c){return c.toLowerCase().includes(categoryFilter.toLowerCase());}).map(function(c){return h('button',{key:c,className:'category-btn',onClick:function(){addSceneType(c);setCategoryFilter('');}},c);})
        )
      ),
      pendingCards.length>0&&h('div',{className:'picker-section'},
        h('div',{className:'picker-heading'},pendingCards.length<3?'Optionally add a descriptor, or start the round':'Maximum 3 cards reached'),
        pendingCards.length<3&&h('div',null,
          h('div',{className:'row',style:{marginBottom:'.8rem'}},h('button',{className:'btn btn-outline',onClick:randomDescriptor},'🎲 Random Descriptor')),
          h('div',{className:'category-grid',style:{maxHeight:180}},DESCRIPTORS.filter(function(d){return !pendingCards.includes(d);}).map(function(d){return h('button',{key:d,className:'category-btn',onClick:function(){addDescriptor(d);}},d);}))
        ),
        h('div',{className:'row',style:{marginTop:'1.2rem'}},
          h('button',{className:'btn btn-gold btn-lg',onClick:lockInAndAnnounce},'🎬 Start Round →'),
          h('button',{className:'btn btn-gray',onClick:function(){setPendingCards([]);}},  'Start Over')
        )
      )
    )
  );

  if(announcing)return h('div',{className:'page'},
    h('div',{className:'header'},logoEl),
    h('div',{className:'main'},h(CardAnnouncement,{cards:round.cards,onDone:function(){setAnnouncing(false);}}))
  );

  if(round.scored){
    var sorted=directors.slice().sort(function(a,b){return (totalScores[b.id]||0)-(totalScores[a.id]||0);});
    var topScore=totalScores[sorted[0]&&sorted[0].id]||0;
    var winners=sorted.filter(function(d){return (totalScores[d.id]||0)===topScore;});
    return h('div',{className:'page'},
      h('div',{className:'header'},logoEl),
      h('div',{className:'main'},h(WinnerReveal,{winners:winners,allDirectors:sorted,scores:totalScores,onNewRound:newRound,onNewGame:newGame}))
    );
  }

  var submissions=round.submissions||{};
  var votes=round.votes||{};
  var anySubmitted=directors.some(function(d){return submissions[d.id]!=null;});
  var allSubmitted=directors.length>0&&directors.every(function(d){return submissions[d.id]!=null;});
  var allVoted=directors.length>0&&directors.every(function(d){return votes[d.id]!=null;});
  var votingOpen=round.votingOpen;
  var voteCounts=round.voteCounts||{};
  var roundScores=round.roundScores||{};

  return h('div',{className:'page'},
    showCoin&&h(CoinFlip,{onClose:function(){setShowCoin(false);}}),
    h('div',{className:'header'},
      logoEl,
      h('div',{className:'score-chips'},directors.map(function(d){return h('span',{key:d.id,className:'score-chip',style:{background:d.color}},d.name+': '+(totalScores[d.id]||0)+' pts');})),
      h('div',{style:{display:'flex',gap:'.5rem',alignItems:'center'}},
        h('span',{style:{fontSize:'.68rem',color:'#16a34a'}},h('span',{className:'dot-live'}),'LIVE'),
        h('button',{className:'btn btn-outline',onClick:newGame,style:{fontSize:'.75rem'}},'Reset'))
    ),
    h('div',{className:'main'},
      h('div',{className:'announce-wrap',style:{marginBottom:'-.5rem'}},
        h('div',{className:'curtain-label'},'🎬 The nominees for ',h('span',{style:{fontFamily:"'Bebas Neue',sans-serif",fontStyle:'normal',color:'#f59e0b',letterSpacing:1}},'Best Movie Scene'),' featuring'),
        h('div',{className:'big-cards-row',style:{marginTop:'.4rem'}},
          round.cards.slice(1).concat([round.cards[0]]).map(function(c,i,arr){
            var isScene=i===arr.length-1;
            return h('div',{key:i,className:'big-card visible'+(isScene?' scene-type':''),style:{padding:'.7rem 1.2rem'}},h('div',{className:'big-card-text',style:{fontSize:isScene?'1.6rem':'1.2rem'}},c));
          })
        ),
        h('div',{className:'are-label visible'},'…are')
      ),
      h('div',{className:'subs-grid'},directors.map(function(d){
        var sub=submissions[d.id];
        return h('div',{key:d.id,className:'sub-box',style:{borderColor:sub?hex2rgba(d.color,.5):'#222'}},
          h('div',{className:'sub-title',style:{color:d.color}},d.name,' ',sub?'✓':''),
          sub?h('div',{style:{fontSize:'.82rem',color:'#aaa',fontFamily:"'Playfair Display',serif",fontStyle:'italic'}},'Nomination received')
             :h('div',{className:'sub-waiting'},'Awaiting nomination…')
        );
      })),
      !anySubmitted&&h('div',{style:{textAlign:'center'}},h('p',{style:{color:'#333',fontSize:'.72rem',marginBottom:'.2rem'}},'PIN'),h('p',{style:{fontFamily:"'Bebas Neue',sans-serif",fontSize:'2rem',color:'#f59e0b',letterSpacing:6}},pin)),
      anySubmitted&&!votingOpen&&(
        watchingId?(function(){
          var d=directors.find(function(x){return x.id===watchingId;});
          var sub=submissions[watchingId];
          if(!sub||!d)return null;
          return h('div',{className:'video-area'},
            h('div',{className:'review-label',style:{color:d.color}},'Now screening: '+d.name),
            h('div',{style:{color:'#666',fontSize:'.8rem',fontFamily:"'Playfair Display',serif",fontStyle:'italic',textAlign:'center',marginBottom:'.6rem'}},sub.scene),
            h('iframe',{src:getYTEmbed(sub.link),title:'Scene',allowFullScreen:true,allow:'autoplay'}),
            h('div',{className:'row',style:{marginTop:'1rem'}},
              h('button',{className:'btn btn-gray',onClick:function(){setWatchingId(null);}},'← Back'),
              allSubmitted&&h('button',{className:'btn btn-gold',onClick:openVoting},'Open Voting →')
            )
          );
        })():h('div',{style:{textAlign:'center'}},
          h('p',{style:{color:'#888',fontFamily:"'Playfair Display',serif",fontStyle:'italic',marginBottom:'.8rem'}},allSubmitted?'All nominations in!':'Some nominations in.',' Screen each director\'s scene:'),
          h('div',{className:'row'},directors.filter(function(d){return submissions[d.id];}).map(function(d){return h('button',{key:d.id,className:'btn',style:{background:d.color,color:'#fff'},onClick:function(){setWatchingId(d.id);}},'▶ '+d.name);})),
          anySubmitted&&h('button',{className:'btn btn-gold',style:{marginTop:'1rem'},onClick:openVoting},'Open Voting →'),
          !allSubmitted&&h('button',{className:'btn btn-gray',style:{marginTop:'.5rem',fontSize:'.78rem'},onClick:openVoting},'Skip & Open Voting →')
        )
      ),
      votingOpen&&h('div',{style:{textAlign:'center',width:'100%',maxWidth:560}},
        h('div',{style:{fontFamily:"'Playfair Display',serif",fontStyle:'italic',color:'#aaa',marginBottom:'1rem'}},'Voting is open — directors are casting their votes on their phones…'),
        h('div',{style:{display:'flex',gap:'1rem',justifyContent:'center',flexWrap:'wrap',marginBottom:'1.2rem'}},
          directors.map(function(d){return h('div',{key:d.id,style:{textAlign:'center'}},
            h('div',{style:{width:12,height:12,borderRadius:'50%',background:votes[d.id]!=null?'#16a34a':'#333',margin:'0 auto .3rem'}}),
            h('div',{style:{fontSize:'.75rem',color:votes[d.id]!=null?'#16a34a':'#555'}},d.name)
          );})
        ),
        allVoted?h('button',{className:'btn btn-gold btn-lg',onClick:closeVotingAndScore},'Reveal Results →')
               :h('button',{className:'btn btn-gray',style:{fontSize:'.78rem'},onClick:closeVotingAndScore},'Close Voting Early →')
      )
    )
  );
}

function App(){
  var hash=window.location.hash;
  var isPlayer=hash.startsWith('#player')||hash==='#join';
  return isPlayer?h(PlayerApp,null):h(HostApp,null);
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
})();
</script>
</body>
</html>
